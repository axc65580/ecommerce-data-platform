version: 2

models:
  - name: stg_revenue_by_product
    description: Cleaned revenue metrics aggregated by product
    columns:
      - name: product_id
        description: Unique product identifier
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: Total revenue generated by this product
        tests:
          - not_null
      - name: price_bucket
        description: Product price tier
        tests:
          - accepted_values:
              values: ['budget', 'mid_range', 'premium']

  - name: stg_user_summary
    description: User level purchase and engagement summary
    columns:
      - name: user_id
        description: Unique user identifier
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: Customer value segment
        tests:
          - accepted_values:
              values: ['high_value', 'mid_value', 'low_value']

  - name: stg_conversion_funnel
    description: Event funnel showing user conversion rates
    columns:
      - name: event_type
        description: Type of user event
        tests:
          - unique
          - not_null
